name: Facebook News Sync

# Fully automated: pulls the latest LGU Solano Facebook posts, categorizes them,
# merges them into public/data/news.json, and (if changed) commits it to main.
# The push triggers the regular Cloudflare Workers Builds deploy.
# Stays dormant and harmless until FB_ACCESS_TOKEN is added as a repository secret.

on:
  schedule:
    # Every 20 minutes. GitHub may delay scheduled runs under load, so realistic
    # freshness is ~15-30 min. Tighten/loosen as needed.
    - cron: '*/20 * * * *'
  workflow_dispatch: {} # allows a manual run from the Actions tab for testing

permissions:
  contents: write

concurrency:
  group: facebook-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Sync Facebook posts into public/data/news.json
        id: sync
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          # Optional overrides:
          # FB_API_VERSION: v21.0
          # FB_LIMIT: '25'
          # MAX_FB_ITEMS: '30'
        run: node scripts/sync-facebook.js

      # No [skip ci] marker: Workers Builds honours it and would skip the deploy.
      - name: Commit news.json
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/news.json
          git commit -m 'chore(news): sync Facebook posts'
          git pull --rebase origin main
          git push origin HEAD:main
